name: Complete CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-live-demo

jobs:
  build-test:
    name: "1-2 Build and Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  quality:
    name: "3 Code Quality - SonarQube"
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SonarQube analysis (when configured)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" ]]; then
            echo "::warning::Skipping SonarQube analysis; configure SONAR_TOKEN and SONAR_HOST_URL to enable it."
            exit 0
          fi
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=cicd-live-demo \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.java.jdkHome="$JAVA_HOME"

  security-scan:
    name: "4 Dependency and Filesystem Scan - Trivy"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker:
    name: "5-6 Build and Publish Docker Image"
    runs-on: ubuntu-latest
    needs: [build-test, security-scan, quality]
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      publish_enabled: ${{ steps.preflight.outputs.publish_enabled }}
    steps:
      - name: Check Docker Hub credentials
        id: preflight
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "publish_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping image publish; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable it."
          else
            echo "publish_enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout source
        if: steps.preflight.outputs.publish_enabled == 'true'
        uses: actions/checkout@v4
      - name: Set image tag
        if: steps.preflight.outputs.publish_enabled == 'true'
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.preflight.outputs.publish_enabled == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.preflight.outputs.publish_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: steps.preflight.outputs.publish_enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: "7 Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && needs.docker.outputs.publish_enabled == 'true'
    outputs:
      deploy_enabled: ${{ steps.preflight.outputs.deploy_enabled }}
    steps:
      - name: Check Kubernetes credentials
        id: preflight
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Kubernetes deployment; configure KUBE_CONFIG to enable it."
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout source
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: actions/checkout@v4
      - name: Install kubectl
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        if: steps.preflight.outputs.deploy_enabled == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply namespace and workload manifests
        if: steps.preflight.outputs.deploy_enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed "s|YOUR_DOCKERHUB_USERNAME|$DOCKERHUB_USERNAME|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
      - name: Update image and roll out
        if: steps.preflight.outputs.deploy_enabled == 'true'
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}
        run: |
          kubectl set image deployment/cicd-live-demo app="$IMAGE" -n cicd-demo
          kubectl rollout status deployment/cicd-live-demo -n cicd-demo --timeout=180s

  verify:
    name: "8 Smoke Test and Deployment Verification"
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.deploy_enabled == 'true'
    steps:
      - name: Verify application endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is not set; skipping external smoke test."
            exit 0
          fi
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "$APP_BASE_URL/"
