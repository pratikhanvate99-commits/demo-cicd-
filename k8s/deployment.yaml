apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-live-demo
  namespace: cicd-demo
  labels:
    app: cicd-live-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-live-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cicd-live-demo
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/cicd-live-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cicd-live-demo-pdb
  namespace: cicd-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cicd-live-demo
