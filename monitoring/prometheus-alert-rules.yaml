# Example for Prometheus Operator. Adjust labels/metrics to your installation.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cicd-live-demo-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: cicd-live-demo.rules
      rules:
        - alert: CicdDemoPodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="cicd-demo",deployment="cicd-live-demo"} < 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "CI/CD demo has fewer than two available replicas"
            description: "Check pod events, image pull status, and application logs."
        - alert: CicdDemoHighHttp5xxRate
          expr: sum(rate(http_server_requests_seconds_count{namespace="cicd-demo",status=~"5.."}[5m])) > 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CI/CD demo is returning elevated HTTP 5xx errors"
            description: "Inspect application logs and recent deployment changes."
